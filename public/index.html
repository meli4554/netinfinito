<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NetInFi - Sistema de Gestão de Almoxarifado">
  <title>Login - NetInFi</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <div class="login-logo">NI</div>
        <h1 class="login-title">NetInFi</h1>
        <p class="login-subtitle">Sistema de Gestão de Almoxarifado</p>
      </div>

      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Login</label>
          <input
            type="text"
            id="email"
            class="form-control"
            placeholder="Seu login"
            required
            autocomplete="off"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Senha</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="••••••••"
            required
            autocomplete="off"
          >
        </div>

        <button type="submit" class="btn btn-primary login-btn">
          Entrar no Sistema
        </button>

        <div class="text-center">
          <div class="gov-badge">Sistema Seguro</div>
        </div>
      </form>

      <div class="login-footer">
        <p>NetInFi © 2025 - Sistema de Gestão de Almoxarifado</p>
        <p style="margin-top: 8px; font-size: 11px;">Desenvolvido com segurança e eficiência</p>
      </div>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    // TEMPORÁRIO: Redireciona automaticamente para o dashboard sem login
    window.location.href = '/pages/dashboard.html';
  </script>
</body>
</html>
